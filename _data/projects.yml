# ------------------------------------------------------------
# Every card on the home page comes from this file.
# To add a project: copy one block, edit it, commit. That's it.
#
#   title     – short, specific name (not "Project 1")
#   summary   – ONE sentence: problem → what you did → result
#   tags      – methods / tools, 2-4 items
#   metric    – the headline number, with context
#   page      – link to an in-site case study (optional)
#   repo      – link to the code
#   links     – extra links (story, dashboard, paper), list of label/url
#   image     – card image; add image_fit: cover for photos/networks
#   award     – optional badge, e.g. "2nd place · MICAI 2025"
#   featured  – true = shown in "Featured work"
# ------------------------------------------------------------

- title: The Core-Periphery Structure of Mexican AI
  summary: >-
    25 years of MICAI proceedings turned into an institutional collaboration
    network: it grew from 53 to 852 institutions, yet stayed less integrated
    than chance, with connectivity routed through a 6-institution core.
  tags: [Network science, Null models, Scientometrics, LLM extraction]
  award: "3rd place · MICAI 2026"
  metric: "Springer LNAI 17150"
  page: /projects/micai-core-periphery/
  image: /assets/img/micai/network-2025.jpg
  image_fit: cover
  links:
    - label: Paper
      url: https://doi.org/10.1007/978-3-032-44179-9_39
    - label: Interactive story
      url: /projects/micai-story.html
    - label: Dashboard
      url: https://micai2026-mex-ia-evloution.streamlit.app/
  featured: true

