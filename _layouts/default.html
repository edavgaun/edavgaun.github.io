<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <img class="sb-photo" src="{{ site.author.photo | relative_url }}" alt="{{ site.author.name }}">
      <h1 class="sb-name"><a href="{{ '/' | relative_url }}">{{ site.author.name }}</a></h1>
      <p class="sb-role">{{ site.author.role }}</p>
      <p class="sb-bio">{{ site.author.bio }}</p>
      <nav class="sb-nav">
        <a href="{{ '/#research' | relative_url }}" data-tab="research">Research</a>
        <a href="{{ '/#teaching' | relative_url }}" data-tab="teaching">Teaching</a>
        <a href="{{ '/#showcase' | relative_url }}" data-tab="showcase">Student showcase</a>
      </nav>
      <p class="sb-links">
        <a href="https://github.com/{{ site.author.github }}">GitHub</a>
        <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/">LinkedIn</a>
      </p>
    </aside>

    <main class="content">
      {{ content }}
      <footer class="footer-min muted small">
        © {{ site.time | date: '%Y' }} {{ site.author.name }} · Built with Jekyll on GitHub Pages ·
        <a href="https://github.com/{{ site.author.github }}/{{ site.author.github }}.github.io">View source</a>
      </footer>
    </main>
  </div>

  <script>
    (function () {
      var panels = document.querySelectorAll('.panel');
      var links = document.querySelectorAll('.sb-nav a');
      function show() {
        var id = (location.hash || '#research').slice(1);
        if (panels.length && !document.getElementById(id)) id = 'research';
        panels.forEach(function (p) { p.hidden = p.id !== id; });
        links.forEach(function (a) {
          a.classList.toggle('active', a.dataset.tab === id && (panels.length > 0 || a.dataset.tab === 'research'));
        });
        if (panels.length) window.scrollTo(0, 0);
      }
      window.addEventListener('hashchange', show);
      show();
    })();
  </script>
</body>
</html>
