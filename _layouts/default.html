<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/#work' | relative_url }}">Work</a>
        <a href="{{ '/#teaching' | relative_url }}">Teaching</a>
        <a href="{{ '/#showcase' | relative_url }}">Showcase</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer" id="contact">
    <div class="wrap footer-inner">
      <div>
        <strong>{{ site.author.name }}</strong><br>
        <span class="muted">{{ site.author.role }}</span>
      </div>
      <div class="footer-links">
        <a href="https://github.com/{{ site.author.github }}">GitHub</a>
        <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/">LinkedIn</a>
      </div>
    </div>
    <div class="wrap muted small">Built with Jekyll on GitHub Pages · <a href="https://github.com/{{ site.author.github }}/{{ site.author.github }}.github.io">View source</a></div>
  </footer>
</body>
</html>
